<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard</title>
<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --card: #f4f4f6; --line: #d8d8de;
        --good: #2e7d32; --bad: #c62828; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #16161a; --fg: #ececf1; --muted: #a0a0a8; --card: #212127; --line: #34343c;
          --good: #66bb6a; --bad: #ef5350; } }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0 auto;
       max-width: 1100px; padding: 16px; }
h1 { font-size: 1.4em; margin-bottom: 4px; } h2 { font-size: 1.1em; margin-top: 28px; }
.meta { color: var(--muted); margin: 0 0 12px; }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: .85em; }
td.num, th.num { text-align: right; }
.yes { color: var(--bad); font-weight: 600; } .no { color: var(--good); }
.none { color: var(--muted); }
</style>
</head>
<body>
<h1>Leaderboard</h1>
<p class="meta" id="meta">Loading…</p>
<div id="tracks"></div>
<script>
const TITLES = {n_excess: "Signal count (n_excess)", significance: "Phantom discovery (significance)"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = (x, d = 2) => x === null || x === undefined ? "<span class='none'>–</span>" : Number(x).toFixed(d);

function table(track, revealed) {
  const head = ["#", "Team", "Best attack", "Pull (σ)", "Suspicion", "Detected", "Live evals", "Tokens", "Scoring seeds"];
  if (revealed) head.push("Final median (σ)", "Undetected share");
  const rows = track.rows.map((r, i) => {
    const b = r.best;
    const cells = [i + 1, esc(r.team), b ? esc(b.name) : "<span class='none'>none yet</span>",
      b ? num(b.pull) : num(null), b ? num(b.suspicion) : num(null),
      b ? (b.detected ? "<span class='yes'>yes</span>" : "<span class='no'>no</span>") : num(null),
      `${r.live_used}/${r.cap}`, Number(r.tokens_used || 0).toLocaleString(), esc(r.scoring_seeds_done ?? "–")];
    if (revealed) cells.push(num(r.final?.median_effect), num(r.final?.undetected_fraction));
    return "<tr>" + cells.map((c, j) => `<td class="${j >= 3 && j !== 5 ? "num" : ""}">${c}</td>`).join("") + "</tr>";
  });
  return `<div class="wrap"><table><thead><tr>${head.map((h, j) => `<th class="${j >= 3 && j !== 5 ? "num" : ""}">${h}</th>`).join("")}</tr></thead>` +
         `<tbody>${rows.join("") || "<tr><td colspan='9' class='none'>No teams yet</td></tr>"}</tbody></table></div>`;
}

async function refresh() {
  try {
    const r = await fetch("/api/leaderboard", {cache: "no-store"});
    const d = await r.json();
    const when = new Date(d.updated * 1000).toLocaleTimeString();
    document.getElementById("meta").textContent =
      `Updated ${when}` + (d.frozen ? " · frozen" : "") + (d.revealed ? " · final results revealed" : " · scoring-seed results appear after the reveal");
    document.getElementById("tracks").innerHTML = Object.entries(d.tracks).map(([name, t]) =>
      `<h2>${esc(TITLES[name] || name)}</h2><p class="meta">Live evals on ${esc(t.live_seed)}; scoring seeds ${esc(t.scoring_seeds.join(", "))}</p>` +
      table(t, d.revealed)).join("");
  } catch (e) {
    document.getElementById("meta").textContent = "Could not load the leaderboard; retrying.";
  }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
